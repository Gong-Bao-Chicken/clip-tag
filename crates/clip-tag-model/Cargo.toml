[package]
name = "clip-tag-model"
description = "Local ONNX CLIP inference for clip-tag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.5"
clip-tag-image.workspace = true
dirs.workspace = true
hf-hub.workspace = true
image.workspace = true
ndarray = "0.17"
open_clip_inference.workspace = true
ort = "2.0.0-rc.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
# Apple CoreML execution provider (Neural Engine + GPU on M-series).
coreml = ["open_clip_inference/coreml", "ort/coreml"]
# Windows DirectML execution provider for GPU acceleration.
directml = ["open_clip_inference/directml", "ort/directml"]
# NVIDIA CUDA execution provider.
cuda = ["open_clip_inference/cuda", "ort/cuda"]

[dev-dependencies]
tempfile = "3"
