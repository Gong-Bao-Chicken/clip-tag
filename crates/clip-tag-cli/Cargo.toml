[package]
name = "clip-tag"
description = "CLI for local CLIP-based image tagging and metadata updates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "clip-tag"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

clip-tag-core.workspace = true
clip-tag-metadata.workspace = true
clip-tag-model.workspace = true

[features]
default = []
coreml = ["clip-tag-model/coreml"]
directml = ["clip-tag-model/directml"]
cuda = ["clip-tag-model/cuda"]

[dev-dependencies]
assert_cmd = "2"
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
predicates = "3"
tempfile = "3"
